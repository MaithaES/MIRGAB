<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" width="1100" height="520" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0FB6D6"/></marker>
  </defs>
  <rect width="1100" height="520" fill="#FFFFFF"/>
  <text x="550" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#0A1A44">Mirgab AI - system architecture</text>

  <!-- inputs -->
  <g font-size="15" fill="#0A1A44">
    <rect x="30" y="140" width="170" height="70" rx="12" fill="#E6FAFD" stroke="#0FB6D6" stroke-width="2"/>
    <text x="115" y="170" text-anchor="middle" font-weight="bold">Link (URL)</text>
    <text x="115" y="192" text-anchor="middle" font-size="12" fill="#4A5B7D">website, short link, Maps</text>
    <rect x="30" y="300" width="170" height="70" rx="12" fill="#E6FAFD" stroke="#0FB6D6" stroke-width="2"/>
    <text x="115" y="330" text-anchor="middle" font-weight="bold">Ad / message</text>
    <text x="115" y="352" text-anchor="middle" font-size="12" fill="#4A5B7D">Arabic, Gulf dialect, English</text>
  </g>

  <!-- engines -->
  <g font-size="15" fill="#0A1A44">
    <rect x="290" y="80" width="300" height="75" rx="12" fill="#F2F5FB" stroke="#1D2F63" stroke-width="1.5"/>
    <text x="440" y="110" text-anchor="middle" font-weight="bold">1. URL intelligence</text>
    <text x="440" y="132" text-anchor="middle" font-size="12" fill="#4A5B7D">impersonation, typosquatting, redirects, punycode</text>
    <rect x="290" y="175" width="300" height="75" rx="12" fill="#F2F5FB" stroke="#1D2F63" stroke-width="1.5"/>
    <text x="440" y="205" text-anchor="middle" font-weight="bold">2. Expert rules</text>
    <text x="440" y="227" text-anchor="middle" font-size="12" fill="#4A5B7D">34 rules, 285 AR/EN patterns + trust signals</text>
    <rect x="290" y="270" width="300" height="75" rx="12" fill="#F2F5FB" stroke="#1D2F63" stroke-width="1.5"/>
    <text x="440" y="300" text-anchor="middle" font-weight="bold">3. ML model (explainable)</text>
    <text x="440" y="322" text-anchor="middle" font-size="12" fill="#4A5B7D">TF-IDF + Logistic Regression, word-level reasons</text>
    <rect x="290" y="365" width="300" height="75" rx="12" fill="#FFF4E8" stroke="#FB923C" stroke-width="1.5"/>
    <text x="440" y="395" text-anchor="middle" font-weight="bold">Community reports</text>
    <text x="440" y="417" text-anchor="middle" font-size="12" fill="#4A5B7D">links reported by users (score floor 85)</text>
  </g>

  <!-- fusion -->
  <rect x="660" y="190" width="170" height="140" rx="14" fill="#0A1A44"/>
  <text x="745" y="235" text-anchor="middle" font-size="17" font-weight="bold" fill="#22E0F2">Fusion</text>
  <text x="745" y="260" text-anchor="middle" font-size="12" fill="#FFFFFF">noisy-OR of engines</text>
  <text x="745" y="280" text-anchor="middle" font-size="12" fill="#FFFFFF">minus trust signals</text>
  <text x="745" y="300" text-anchor="middle" font-size="12" fill="#FFFFFF">(official domain,</text>
  <text x="745" y="318" text-anchor="middle" font-size="12" fill="#FFFFFF">permit no., etc.)</text>

  <!-- outputs -->
  <rect x="890" y="80" width="185" height="360" rx="14" fill="#E6FAFD" stroke="#0FB6D6" stroke-width="2"/>
  <text x="982" y="112" text-anchor="middle" font-size="16" font-weight="bold" fill="#0A1A44">Output</text>
  <g font-size="13" fill="#0A1A44">
    <text x="908" y="150">• Risk score 0-100</text>
    <text x="908" y="182">• Risk level</text>
    <text x="908" y="214">• Fraud domain(s)</text>
    <text x="908" y="246">• Impact: financial,</text>
    <text x="922" y="264">health, identity, social</text>
    <text x="908" y="296">• Reasons + evidence</text>
    <text x="908" y="328">• Protective advice</text>
    <text x="908" y="360">• Report channels</text>
    <text x="922" y="378">(Aman 8002626)</text>
  </g>

  <!-- arrows -->
  <g stroke="#0FB6D6" stroke-width="2" fill="none" marker-end="url(#a)">
    <path d="M200 175 L288 117"/>
    <path d="M200 175 L288 400"/>
    <path d="M200 335 L288 212"/>
    <path d="M200 335 L288 307"/>
    <path d="M590 117 L658 230"/>
    <path d="M590 212 L658 250"/>
    <path d="M590 307 L658 275"/>
    <path d="M590 402 L658 300"/>
    <path d="M830 260 L888 260"/>
  </g>

  <!-- footer -->
  <text x="550" y="480" text-anchor="middle" font-size="13" fill="#4A5B7D">Runs offline. Same engine in Python (web app, API, CLI) and JavaScript (browser version, nothing leaves the device).</text>
  <text x="550" y="502" text-anchor="middle" font-size="13" fill="#4A5B7D">Privacy: message text is never stored; dashboard keeps only domain, score and category.</text>
</svg>
