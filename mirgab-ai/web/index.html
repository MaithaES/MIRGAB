<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mirgab AI | مِرقاب</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#040b24;--bg2:#0a1638;--line:#1d2f63;--cyan:#22e0f2;--cyan2:#0fb6d6;--text:#e8f1ff;--muted:#8fa3c9;
--safe:#22c55e;--caution:#facc15;--suspicious:#fb923c;--critical:#ef4444}
*{box-sizing:border-box}
body{margin:0;font-family:"Tajawal",system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text);
background:radial-gradient(1200px 600px at 80% -10%,#0c2a6b55,transparent),radial-gradient(900px 500px at 0% 100%,#0a3a6b44,transparent),var(--bg);min-height:100vh}
.wrap{max-width:1000px;margin:0 auto;padding:18px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:12px}
.brand img{height:50px;border-radius:10px}
.brand h1{margin:0;font-size:22px;letter-spacing:1px}
.brand small{color:var(--cyan);display:block;font-size:13px}
.btn{border:1px solid var(--line);background:var(--bg2);color:var(--text);padding:8px 14px;border-radius:10px;cursor:pointer;font:inherit;font-size:14px;text-decoration:none;display:inline-block}
.btn:hover{border-color:var(--cyan)}
.btn.on{border-color:var(--cyan);background:#13285e}
.hero{text-align:center;margin:26px 0 16px}
.hero h2{font-size:32px;margin:0 0 8px;font-weight:800}
.hero h2 span{color:var(--cyan)}
.hero p{color:var(--muted);margin:0 auto;max-width:620px;line-height:1.7}
.beta{display:inline-block;margin-bottom:10px;font-size:12px;padding:3px 10px;border-radius:99px;background:#2a1e5a;color:#ddd6fe}
.card{background:linear-gradient(180deg,#10214f,#0c1a40);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 10px 40px #0006}
textarea,input{width:100%;background:#071233;border:1px solid var(--line);color:var(--text);border-radius:12px;padding:13px;font:inherit;font-size:16px;resize:vertical}
textarea:focus,input:focus{outline:none;border-color:var(--cyan);box-shadow:0 0 0 3px #22e0f222}
.row{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap;align-items:center}
.primary{background:linear-gradient(90deg,var(--cyan),var(--cyan2));color:#04122e;border:0;padding:13px 26px;border-radius:12px;cursor:pointer;font:inherit;font-weight:800;font-size:17px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.chiplbl{width:100%;color:var(--muted);font-size:13px}
.chip{font-size:13px;padding:6px 10px;border-radius:999px;border:1px solid var(--line);background:#0a1840;color:var(--muted);cursor:pointer}
.chip:hover{color:var(--text);border-color:var(--cyan)}
.privacy{color:var(--muted);font-size:12.5px;margin-top:10px}
#result{display:none;margin-top:16px}
.grid{display:grid;grid-template-columns:280px 1fr;gap:14px}
.gauge{text-align:center}
.lvl{font-size:22px;font-weight:800;margin-top:-6px}
.cat{color:var(--muted);margin-top:6px}
.official{margin-top:8px;color:var(--safe);font-weight:700}
h3{margin:0 0 12px;font-size:17px;color:var(--cyan)}
.reason{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px dashed var(--line)}
.reason:last-child{border:0}
.tag{font-size:11px;padding:2px 7px;border-radius:6px;background:#132a63;color:var(--cyan);white-space:nowrap}
.tag.text{background:#2a1e5a;color:#c4b5fd}.tag.trust{background:#123d2a;color:#86efac}
.w{margin-inline-start:auto;font-weight:700;color:var(--muted);font-size:13px;white-space:nowrap}
.ev{color:var(--muted);font-size:12px;unicode-bidi:plaintext}
.b{margin:9px 0}.lbl{display:flex;justify-content:space-between;font-size:14px;margin-bottom:4px}
.bar{height:9px;background:#071233;border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--cyan2),var(--cyan));transition:width .8s}
.terms span{display:inline-block;margin:3px;padding:4px 9px;border-radius:8px;background:#2a1e5a;color:#ddd6fe;font-size:13px}
ul.adv{margin:0;padding-inline-start:18px;line-height:1.9}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
.report{background:#2a0f17;border:1px solid #5b1a2a;margin-top:14px}.report h3{color:#fca5a5}
.fb{margin-top:14px;border-color:#22e0f255}
.fb .q{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 10px}
.fb label{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:13px;margin-top:8px}
.fb label input{width:auto}
.msg{margin-top:10px;font-size:14px;color:var(--safe)}
.alt{margin-top:10px;font-size:13px;color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:12px}
.kpi{background:#071233;border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}.kpi b{display:block;font-size:24px}.kpi span{font-size:12px;color:var(--muted)}
.fbi{border-top:1px dashed var(--line);padding:10px 0}.fbi .top{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:13px}
.pill{padding:2px 8px;border-radius:99px;font-size:12px;background:#132a63}
.fbi .cmt{margin-top:6px;font-size:15px}.fbi .chk{margin-top:4px;font-size:12.5px;color:var(--muted);unicode-bidi:plaintext;word-break:break-word}
@media(max-width:780px){.kpis{grid-template-columns:repeat(3,1fr)}}
footer{text-align:center;color:var(--muted);font-size:12.5px;margin:30px 0 10px;line-height:1.7}
@media(max-width:780px){.grid,.cols{grid-template-columns:1fr}.hero h2{font-size:25px}}
</style>
</head>

const EXAMPLES=[
 {ar:"🏠 إعلان شقة",en:"🏠 Rental ad",t:"فيلا فاخرة في جزيرة الريم بإيجار 1200 درهم شهري فقط. المالك خارج الدولة، حول العربون ونرسل لك المفاتيح. واتساب فقط"},
 {ar:"💊 أدوية",en:"💊 Medicine",t:"Buy Ozempic and Xanax without prescription, discreet delivery anywhere in UAE. Order on WhatsApp only."},
 {ar:"🛒 متجر",en:"🛒 Store",t:"ايفون 17 برو بخصم 90% فقط 499 درهم! تحويل بنكي فقط ولا يوجد دفع عند الاستلام. العرض اليوم فقط",u:"https://iphone-uae-deals.shop"},
 {ar:"📈 استثمار",en:"📈 Investment",t:"Guaranteed returns of 40% weekly! Join our VIP group, invite friends for referral bonus. Minimum deposit 500 AED in USDT."},
 {ar:"🏦 رسالة بنك",en:"🏦 Bank SMS",t:"عميلنا العزيز، سيتم إيقاف حسابك. يرجى تحديث الهوية فوراً وإدخال رمز التحقق عبر الرابط https://adcb-secure-update.com/login"},
 {ar:"📍 نتيجة خرائط",en:"📍 Maps result",t:"Found the bank customer service number on Google Maps listing, they asked me to share my card number and OTP",u:"https://maps.app.goo.gl/Xy12ab"},
 {ar:"✅ رسالة سليمة",en:"✅ Safe message",t:"بنك أبوظبي التجاري: لن نطلب منك أبداً رمز التحقق أو الرقم السري. لا تشارك رمز التحقق مع أي شخص.",u:"https://www.adcb.com"}
];
let lang="ar",last=null,lastInput=null,E=null,verdict=null;
try{lang=localStorage.getItem("mirgab_lang")||"ar"}catch(e){}
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const COLORS={safe:"var(--safe)",caution:"var(--caution)",suspicious:"var(--suspicious)",critical:"var(--critical)"};

function applyLang(){
  const L=I18N[lang];document.documentElement.lang=lang;document.documentElement.dir=lang==="ar"?"rtl":"ltr";
  document.querySelectorAll("[data-i]").forEach(e=>e.innerHTML=L[e.dataset.i]);
  document.querySelectorAll("[data-ph]").forEach(e=>e.placeholder=L[e.dataset.ph]);
  $("langBtn").textContent=lang==="ar"?"English":"العربية";
  $("examples").innerHTML=`<span class="chiplbl">${L.chipsLbl}</span>`+EXAMPLES.map((e,k)=>`<span class="chip" data-k="${k}">${e[lang]}</span>`).join("");
  document.querySelectorAll(".chip[data-k]").forEach(c=>c.onclick=()=>{const e=EXAMPLES[c.dataset.k];$("text").value=e.t;$("url").value=e.u||"";run();});
  if(last)render(last);
}
$("langBtn").onclick=()=>{lang=lang==="ar"?"en":"ar";try{localStorage.setItem("mirgab_lang",lang)}catch(e){};applyLang();};

function bar(label,v,color){return `<div class="b"><div class="lbl"><span>${label}</span><b>${v}</b></div><div class="bar"><i style="width:${v}%;${color?`background:${color}`:""}"></i></div></div>`}
let pending=false;
function run(){
  if(!E){pending=true;return;}
  const text=$("text").value.trim(),url=$("url").value.trim();if(!text&&!url)return;
  lastInput={text,url};last=E.analyze({text,url});verdict=null;
  document.querySelectorAll(".fb .q .btn").forEach(b=>b.classList.remove("on"));
  $("fbText").value="";$("fbMsg").textContent="";$("fbAlt").style.display="none";
  render(last);$("result").style.display="block";$("result").scrollIntoView({behavior:"smooth"});
}
$("go").onclick=run;
$("text").addEventListener("keydown",e=>{if(e.key==="Enter"&&(e.ctrlKey||e.metaKey))run();});
function render(r){
  const L=I18N[lang],col=COLORS[r.level];
  $("arc").style.strokeDashoffset=251.3*(1-r.score/100);$("arc").style.stroke=col;
  $("scoreTxt").textContent=r.score;$("lvl").textContent=r.level_label[lang];$("lvl").style.color=col;
  $("cat").textContent=r.category[lang];$("official").textContent=r.official_entity?("✔ "+r.official_entity):"";
  $("components").innerHTML=["url","content_rules","ml","trust_reduction"].map(k=>bar(L[k],r.components[k],k==="trust_reduction"?"var(--safe)":"")).join("");
  const items=r.reasons.map(x=>`<div class="reason"><span class="tag ${x.source}">${L["src_"+x.source]||x.source}</span><div>${esc(x[lang])}${x.evidence&&x.evidence.length?`<div class="ev">${x.evidence.map(esc).join(" · ")}</div>`:""}</div><span class="w">+${Math.round(x.weight*100)}</span></div>`)
   .concat(r.trust_signals.map(x=>`<div class="reason"><span class="tag trust">${L.src_trust}</span><div>${esc(x[lang])}</div><span class="w" style="color:var(--safe)">−${Math.round(x.weight*100)}</span></div>`));
  $("reasons").innerHTML=items.length?items.join(""):`<p class="ev">${L.none}</p>`;
  const terms=r.ml&&r.ml.top_fraud_terms.length?r.ml.top_fraud_terms:null;
  $("termsBox").style.display=terms?"block":"none";if(terms)$("terms").innerHTML=terms.map(t=>`<span>${esc(t.term)}</span>`).join("");
  $("impact").innerHTML=["financial","health","identity","social"].map(k=>bar(L[k],r.impact[k],r.impact[k]>=60?"var(--critical)":r.impact[k]>=30?"var(--suspicious)":"")).join("");
  $("advice").innerHTML=r.advice[lang].map(a=>`<li>${esc(a)}</li>`).join("");
  $("reportBox").style.display=r.report_channels?"block":"none";
  if(r.report_channels)$("channels").innerHTML=r.report_channels[lang].map(a=>`<li>${esc(a)}</li>`).join("");
}

// ---------------- Feedback ----------------
document.querySelectorAll(".fb .q .btn").forEach(b=>b.onclick=()=>{verdict=b.dataset.v;document.querySelectorAll(".fb .q .btn").forEach(x=>x.classList.toggle("on",x===b));});
function feedbackRecord(){
  return {ts:new Date().toISOString(),lang,verdict,comment:$("fbText").value.trim().slice(0,1000),
    score:last.score,level:last.level,category:last.category.key,
    input:$("fbInclude").checked?{text:lastInput.text.slice(0,1500),url:lastInput.url.slice(0,500)}:null};
}
function feedbackText(f){
  const v={right:"Right ✅",too_high:"Risk too high ⬆️",too_low:"Risk too low ⬇️"}[f.verdict];
  let s=`Mirgab feedback\nResult: ${f.score}/100 (${f.level}, ${f.category})\nVerdict: ${v}`;
  if(f.comment)s+=`\nComment: ${f.comment}`;
  if(f.input){if(f.input.text)s+=`\nChecked text: ${f.input.text}`;if(f.input.url)s+=`\nChecked link: ${f.input.url}`;}
  return s;
}
let dbP=null,userP=null;
try{if(window.claude&&claude.use){dbP=claude.use("db");userP=claude.use("user");}}catch(e){}
async function saveToDb(f){
  if(!dbP||!userP)return false;
  const timeout=new Promise(r=>setTimeout(()=>r(null),8000));
  try{
    const [db,user]=await Promise.race([Promise.all([dbP,userP]),timeout.then(()=>[null,null])]);
    if(!db||!user)return false;
    const uid=await user.id();if(!uid)return false;
    const ref=db.collection("feedback").doc(uid);
    const snap=await ref.get();
    const prev=snap&&snap.exists&&snap.data&&snap.data()?snap.data().entries||[]:[];
    await ref.set({entries:prev.concat([f]).slice(-200),updated:f.ts});
    return true;
  }catch(e){return false;}
}
$("fbSend").onclick=async()=>{
  const L=I18N[lang];if(!last)return;
  if(!verdict){$("fbMsg").style.color="var(--caution)";$("fbMsg").textContent=L.fbPick;return;}
  const f=feedbackRecord();$("fbSend").disabled=true;
  const ok=await saveToDb(f);$("fbSend").disabled=false;
  const txt=feedbackText(f);
  $("waLink").href="https://wa.me/?text="+encodeURIComponent(txt);
  $("copyBtn").onclick=async()=>{try{await navigator.clipboard.writeText(txt);$("copyBtn").textContent=L.copied;}catch(e){}};
  if(ok){$("fbMsg").style.color="var(--safe)";$("fbMsg").textContent=L.fbSaved;$("fbAlt").style.display="none";}
  else{$("fbMsg").textContent="";$("fbAlt").style.display="block";}
};

// ---------------- Owner-only feedback inbox ----------------
let fbRows=[];
(async()=>{try{if(!userP)return;const u=await userP;if(u&&(await u.canEdit())){$("inboxBtn").style.display="inline-block";}}catch(e){}})();
async function loadInbox(){
  const L=I18N[lang];$("inboxList").innerHTML=`<p class="ev">${L.loading}</p>`;$("inboxKpis").innerHTML="";
  try{
    const db=await dbP;if(!db)throw 0;
    const snap=await Promise.race([db.collection("feedback").get(),new Promise((_,rej)=>setTimeout(()=>rej(0),10000))]);
    fbRows=[];snap.docs.forEach((d,i)=>{const data=d.data()||{};(data.entries||[]).forEach(e=>fbRows.push({...e,tester:i+1}));});
    fbRows.sort((a,b)=>String(b.ts).localeCompare(String(a.ts)));renderInbox();
  }catch(e){$("inboxList").innerHTML=`<p class="ev">${L.loadFail}</p>`;}
}
function renderInbox(){
  const L=I18N[lang],n=v=>fbRows.filter(r=>r.verdict===v).length;
  const k=[[fbRows.length,L.kTotal],[n("right"),L.kRight],[n("too_high"),L.kHigh],[n("too_low"),L.kLow],[fbRows.filter(r=>r.comment).length,L.kComments]];
  $("inboxKpis").innerHTML=k.map(([v,t])=>`<div class="kpi"><b>${v}</b><span>${t}</span></div>`).join("");
  const vl={right:L.kRight,too_high:L.kHigh,too_low:L.kLow};
  $("inboxList").innerHTML=fbRows.length?fbRows.map(r=>`<div class="fbi"><div class="top"><span class="pill">${esc(vl[r.verdict]||r.verdict)}</span><span class="pill" style="color:${COLORS[r.level]||"inherit"}">${r.score}/100</span><span class="ev">${esc(L.tester)} ${r.tester} · ${esc(new Date(r.ts).toLocaleString(lang==="ar"?"ar-AE":"en-GB"))}</span></div>
    <div class="cmt">${r.comment?esc(r.comment):`<span class="ev">${L.noComment}</span>`}</div>
    ${r.input?`<div class="chk">${esc([r.input.text,r.input.url].filter(Boolean).join(" | ").slice(0,300))}</div>`:""}</div>`).join(""):`<p class="ev">${L.noFb}</p>`;
}
$("inboxBtn").onclick=()=>{$("inbox").style.display="block";loadInbox();$("inbox").scrollIntoView({behavior:"smooth"});};
$("inboxRefresh").onclick=loadInbox;
$("inboxClose").onclick=()=>{$("inbox").style.display="none";};
$("inboxCsv").onclick=async()=>{
  const q=v=>'"'+String(v??"").replace(/"/g,'""')+'"';
  const csv=["time,tester,verdict,score,level,category,comment,checked_text,checked_url"].concat(fbRows.map(r=>[r.ts,r.tester,r.verdict,r.score,r.level,r.category,r.comment,r.input&&r.input.text,r.input&&r.input.url].map(q).join(","))).join("\n");
  try{await navigator.clipboard.writeText(csv);$("inboxCsv").textContent=I18N[lang].copied;setTimeout(()=>$("inboxCsv").textContent=I18N[lang].copyCsv,2000);}catch(e){}
};
const _applyLang=applyLang;applyLang=function(){_applyLang();if($("inbox").style.display==="block")renderInbox();};

applyLang();
fetch("engine_data.json").then(r=>r.json()).then(d=>{E=MirgabEngine(d);if(pending)run();}).catch(()=>{});
</script>
